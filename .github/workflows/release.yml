name: Release

# Pousser un tag comme v0.1.0 compile l'installateur Windows à partir de ce
# commit et le publie comme release GitHub. Il est aussi publié sous le nom
# Ellipse-Setup-x64.exe : le site pointe vers releases/latest/download/…
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    name: Installateur Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - name: Vérifier que le tag correspond à la version de l'app
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          version=$(node -p "require('./src-tauri/tauri.conf.json').version")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME, mais l'app est en version $version"
            exit 1
          fi
      - run: npx tauri build
      - name: Préparer l'installateur
        shell: bash
        run: |
          version=$(node -p "require('./src-tauri/tauri.conf.json').version")
          cp "src-tauri/target/release/bundle/nsis/Ellipse_${version}_x64-setup.exe" Ellipse-Setup-x64.exe
          sha256sum Ellipse-Setup-x64.exe > Ellipse-Setup-x64.exe.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: Ellipse-Setup-x64
          path: |
            Ellipse-Setup-x64.exe
            Ellipse-Setup-x64.exe.sha256
      - name: Publier la release
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          {
            echo "**Bêta publique.** Installateur pour Windows 10 et 11 (64 bits). Des bugs restent possibles : signalez-les dans les issues."
            echo
            echo "Windows peut afficher « Windows a protégé votre ordinateur » : cliquez sur « Informations complémentaires », puis « Exécuter quand même ». Cet installateur est compilé par GitHub Actions à partir de ce commit ; son empreinte SHA-256 est jointe."
            echo
            echo "---"
            echo "[Site](https://blasteur1916.github.io/ellipse-notch/) · [Politique de compilation](https://blasteur1916.github.io/ellipse-notch/code-signing/) · [Confidentialité](https://blasteur1916.github.io/ellipse-notch/confidentialite/)"
          } > notes.md
          gh release create "$GITHUB_REF_NAME" Ellipse-Setup-x64.exe Ellipse-Setup-x64.exe.sha256 \
            --title "Ellipse $version (bêta)" \
            --notes-file notes.md
