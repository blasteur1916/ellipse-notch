[package]
name = "ellipse"
version = "0.1.1"
edition = "2021"

[lib]
name = "ellipse_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
tauri-plugin-drag = "2.1.1"
notify = "9.0.0"
notify-debouncer-full = "0.8.0"
serde_json = "1.0.154"
trash = "5.4.0"
uuid = { version = "1.29.3", features = ["v4"] }
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_UI_Shell", "Win32_Graphics_Gdi", "Win32_System_Com", "Win32_UI_WindowsAndMessaging", "Win32_System_LibraryLoader", "Win32_Graphics_Dwm"] }
png = "0.18.1"
base64 = "0.22"
webview2-com = "0.39.1"
axum = { version = "0.8.9", features = ["ws"] }
tokio = { version = "1.54.1", features = ["fs", "io-util", "net", "sync", "macros", "rt"] }
tokio-util = { version = "0.7.20", features = ["io"] }
local-ip-address = "0.6.13"
futures-util = "0.3.34"
qrcode = { version = "0.15.0", default-features = false, features = ["svg"] }
tauri-plugin-autostart = "2"
tauri = { version = "2", features = ["tray-icon"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
